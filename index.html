<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23f5c542'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='14' font-family='Arial' font-weight='700' fill='%23000'%3EP%3C/text%3E%3C/svg%3E">
  <title>Stanowisko · PAPER</title>
<style>
    :root {
      --bg: #000;
      --text: #fff;
      --muted: #6e6e73;
      --dim: #3a3a3c;
      --green: #22f08a;
      --green-2: #14c86e;
      --red: #ff3b5c;
      --yellow: #f5c542;
      --cyan: #5ce1ff;
      --orange: #ff8a3d;
      --card: #0e0e0e;
      --card-edge: rgba(255,255,255,.07);
      --pill: #141414;
      --hair: rgba(255,255,255,.08);
      --safe-t: max(20px, env(safe-area-inset-top));
      --safe-b: max(16px, env(safe-area-inset-bottom));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-feature-settings: "tnum" 1, "ss01" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100%;
      overflow-x: hidden;
    }
    body { padding-bottom: var(--safe-b); }
    a { color: inherit; text-decoration: none; }
    .wrap { padding: var(--safe-t) 0 28px; max-width: 480px; margin: 0 auto; }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px 0;
    }
    .brand {
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #8e8e93;
    }
    .paper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--yellow);
      color: #14110a;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .paper .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #14110a;
      box-shadow: 0 0 0 0 rgba(20,17,10,.55);
      animation: livepulse 1.6s ease-out infinite;
    }
    @keyframes livepulse {
      0% { box-shadow: 0 0 0 0 rgba(20,17,10,.55); }
      70% { box-shadow: 0 0 0 6px rgba(20,17,10,0); }
      100% { box-shadow: 0 0 0 0 rgba(20,17,10,0); }
    }

    .hero { padding: 16px 22px 0; }
    .value {
      display: flex;
      align-items: baseline;
      font-weight: 720;
      font-size: 58px;
      letter-spacing: -2.6px;
      line-height: 0.95;
      color: #fff;
      font-variation-settings: "wght" 700, "opsz" 32;
      white-space: nowrap;
    }
    .value .sigil { font-size: .78em; letter-spacing: -1.6px; margin-right: 1px; }
    .value .cents {
      font-size: .48em;
      letter-spacing: -1.1px;
      font-weight: 650;
      margin-left: 1px;
      display: inline-flex;
      align-items: flex-start;
      position: relative;
      top: -0.28em;
      opacity: .96;
    }
    .pl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      min-height: 28px;
      flex-wrap: wrap;
    }
    .pl {
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: -0.4px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .pl.up { color: var(--green); }
    .pl.down { color: var(--red); }
    .pl.flat { color: #8e8e93; }
    .meta-line {
      padding: 8px 22px 0;
      font-size: 12.5px;
      color: #8e8e93;
      font-weight: 500;
      letter-spacing: -0.1px;
    }
    .meta-line b { color: #fff; font-weight: 650; }

    .chart-wrap {
      position: relative;
      height: 178px;
      margin: 10px 0 2px;
      overflow: visible;
    }
    .chart-wrap svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .ranges {
      display: flex;
      gap: 7px;
      padding: 10px 22px 0;
      justify-content: flex-start;
      align-items: center;
    }
    .ranges .pill {

      padding: 0 12px;

    .ranges .pill .dot {

    }
    .ranges .hint {

      color: #8e8e93;

    }

    .sec { padding: 28px 0 0; }

    .sec-h h2 {

    .scroller {

    .scroller::-webkit-scrollbar { display: none; }
    .acard {

    .acard.wide { flex-basis: 318px; }
    .acard .hd {

    .acard .hd .mark {

    .acard .hd h3 {

    .acard .en {

    .stats {
      display: grid;

    }
    .stat .n {
      font-size: 26px;
      font-weight: 720;

    }
    .stat .l {

    .comps { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .comp { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .comp .cl { font-size: 11px; color: #8e8e93; font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .comp .cv { font-size: 11.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .cbar { grid-column: 1 / -1; height: 4px; border-radius: 99px; background: #2a2a2e; overflow: hidden; margin-top: -3px; }
    .cbar > i { display: block; height: 100%; border-radius: 99px; background: var(--yellow); }
    .tokrow {
      display: flex; justify-content: space-between; align-items: baseline;

    }
    .tokrow .ts { font-weight: 650; }
    .tokrow .sc { font-weight: 700; color: var(--yellow); }
    .risk { display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center; }
    .risk .r {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13.5px;
    }
    .risk .r .k { color: #8e8e93; font-weight: 500; }
    .risk .r .v { font-weight: 680; letter-spacing: -0.2px; }
    .bar {
      height: 7px; border-radius: 99px; background: #2a2a2e; overflow: hidden;
      margin-top: -4px;
    }
    .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--green); width: 0; }
    .bar.warn > i { background: var(--yellow); }
    .bar.hot > i { background: var(--red); }
    .rules {
      margin-top: 2px;
      font-size: 12px;
      color: #8e8e93;
      font-weight: 500;
      line-height: 1.45;
    }
    .dots {
      display: flex; justify-content: center; gap: 6px;
      padding: 12px 0 0;
    }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%;
      background: #2c2c2e;
      display: block;
    }
    .dots i.on { background: #fff; width: 16px; border-radius: 99px; }

    .pad { padding: 0 22px; }
    .funnel { display: flex; flex-direction: column; gap: 8px; }
    .frow { display: flex; flex-direction: column; gap: 4px; }
    .frow .flab {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px;
    }
    .frow .flab .fk { color: #8e8e93; font-weight: 500; }
    .frow .flab .fv { font-weight: 680; letter-spacing: -0.2px; }
    .fbar { height: 10px; border-radius: 99px; background: #161616; overflow: hidden; }
    .fbar > i { display: block; height: 100%; border-radius: 99px; background: var(--cyan); min-width: 0; }
    .fbar.s2 > i { background: var(--orange); }
    .fbar.s3 > i { background: var(--yellow); }
    .fbar.s4 > i { background: var(--green); }
    .fbar.s5 > i { background: #fff; }

    .reason { margin-bottom: 11px; }
    .reason .rl {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 13.5px; margin-bottom: 5px;
    }
    .reason .rn { font-weight: 600; letter-spacing: -0.2px; }
    .reason .rc { color: #8e8e93; font-weight: 580; font-variant-numeric: tabular-nums; }
    .rbar { height: 7px; border-radius: 99px; background: #1a1a1a; overflow: hidden; }
    .rbar > i { display: block; height: 100%; border-radius: 99px; background: var(--red); opacity: .9; }

    .list { padding: 0 10px; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      min-width: 0;
    }
    .sym {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 38%;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .why {
      color: var(--red);
      font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 500;
      text-align: left;
    }
    .row .t { display: flex; align-items: baseline; gap: 8px; }
    .row .stage { width: auto; }
    .when {
      flex: 0 0 auto;
      font-size: 12px;
      color: #6e6e73;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      white-space: nowrap;
    }
    .stage {
      font-size: 10.5px;
      color: #6e6e73;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
      width: 58px;
      flex-shrink: 0;
    }

    .score-card {
      margin: 0 22px 12px;
      background: linear-gradient(180deg, #141414 0%, #0c0c0c 100%);
      border: 1px solid var(--card-edge);
      border-radius: 20px;
      padding: 14px 16px 14px;
    }
    .score-card .sh {
      display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
      margin-bottom: 10px;
    }
    .score-card .sh a {
      font-size: 17px; font-weight: 720; letter-spacing: -0.4px;
    }
    .score-card .sh a:after {
      content: " ↗";
      color: #6e6e73;
      font-size: 13px;
    }
    .score-card .num {
      font-size: 22px; font-weight: 730; letter-spacing: -0.8px; color: var(--yellow);
    }
    .score-card .num.pass { color: var(--green); }
    .tag {
      display: inline-flex; align-items: center;
      height: 20px; padding: 0 8px; border-radius: 99px;
      background: #1a1a1a; color: #8e8e93;
      font-size: 11px; font-weight: 650; letter-spacing: .02em;
      margin-left: 6px;
    }
    .tag.yes { background: rgba(34,240,138,.12); color: var(--green); }

    .pos-card {
      margin: 0 22px 12px;
      background: #0e0e0e;
      border: 1px solid var(--card-edge);
      border-radius: 18px;
      padding: 14px 16px;
    }
    .pos-card .ph {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .pos-card .ph .ps { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .pos-card .pnl { font-size: 16px; font-weight: 680; }
    .pos-card .pnl.up { color: var(--green); }
    .pos-card .pnl.down { color: var(--red); }
    .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; }
    .kv .k { font-size: 11.5px; color: #8e8e93; font-weight: 500; }
    .kv .v { font-size: 13.5px; font-weight: 650; letter-spacing: -0.2px; margin-top: 1px; }

    .act { padding: 0 10px; }
    .arow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 16px;
    }
    .av {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 730; font-size: 12px; letter-spacing: -0.3px;
      flex-shrink: 0; color: #fff; background: #1a1a1a;
    }
    .av.in { background: rgba(34,240,138,.16); color: var(--green); }
    .av.out { background: rgba(255,59,92,.16); color: var(--red); }
    .av.score { background: rgba(245,197,66,.16); color: var(--yellow); }
    .av.cycle { background: #161616; color: #c7c7cc; }
    .abody { flex: 1; min-width: 0; }
    .abody .t {
      font-size: 15.5px; font-weight: 650; letter-spacing: -0.3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .abody .s { font-size: 12.5px; color: #8e8e93; margin-top: 2px; font-weight: 500; }
    .amoney { text-align: right; flex-shrink: 0; }
    .amoney .a { font-size: 13px; font-weight: 600; color: #8e8e93; font-variant-numeric: tabular-nums; }
    .amoney.up .a { color: var(--green); }
    .amoney.down .a { color: var(--red); }

    @media (min-width: 420px) {
      .value { font-size: 64px; letter-spacing: -2.8px; }
    }
  
    .banner {
      margin: 12px 22px 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,59,92,.12);
      border: 1px solid rgba(255,59,92,.28);
      color: #ff8fa3;
      font-size: 13px;
      font-weight: 550;
      line-height: 1.45;
    }
    .banner.warn {
      background: rgba(245,197,66,.12);
      border-color: rgba(245,197,66,.28);
      color: var(--yellow);
    }
    .banner.ok {
      background: rgba(34,240,138,.10);
      border-color: rgba(34,240,138,.22);
      color: var(--green);
    }
    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 9px;
      border-radius: 99px;
      background: rgba(34,240,138,.14);
      color: var(--green);
      font-size: 10.5px;
      font-weight: 780;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .live-tag .dot {
      width: 6px; height: 6px; border-radius: 50%;

      box-shadow: 0 0 0 0 rgba(34,240,138,.55);
      animation: livepulse 1.6s ease-out infinite;
    }
    .live-tag.off {
      background: #1a1a1a;
      color: #8e8e93;
    }
    .live-tag.off .dot { background: #6e6e73; animation: none; box-shadow: none; }
    .live-meta {
      font-size: 12px;
      color: #8e8e93;
      font-weight: 500;
    }
    .wallet {
      margin: 12px 22px 0;
      padding: 12px 14px;
      border-radius: 16px;
      background: #0e0e0e;
      border: 1px solid var(--card-edge);
    }
    .wallet .wl {
      font-size: 11px;
      color: #8e8e93;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .wallet .wv {
      font-size: 22px;
      font-weight: 720;
      letter-spacing: -0.7px;
      margin-top: 4px;
    }
    .wallet .wa {
      font-size: 11px;
      color: #8e8e93;
      margin-top: 5px;
      font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      word-break: break-all;
      line-height: 1.4;
    }
    .wallet .wa a { border-bottom: 1px solid #2c2c2e; }
    .mint {
      font-size: 11px;
      color: #6e6e73;
      font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      margin-top: 8px;
      word-break: break-all;
      line-height: 1.4;
    }
    .mint a { border-bottom: 1px solid #2c2c2e; }
    .pos-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .stale { color: #8e8e93; font-weight: 580; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="top">
      <div class="brand">Stanowisko</div>
      <div class="paper"><i class="dot"></i>PAPER</div>
    </div>
    <div class="hero">
      <div class="value"><span class="sigil">$</span><span>—</span></div>
    </div>
    <div class="meta-line">Wczytywanie data.json…</div>
  </div>
  <script>
  (function () {
    const DEX_V1 = "https://api.dexscreener.com/tokens/v1/solana/";
    const DEX_LEGACY = "https://api.dexscreener.com/latest/dex/tokens/";
    const RPC_DEFAULT = "https://solana-rpc.publicnode.com";
    const WALLET_DEFAULT = "Gyt2TBaQTGskoZ2PfUNcVTC3brSRvmgTQEexvgZ4MP34";
    const DATA_INTERVAL = 20000;
    const PRICE_INTERVAL = 15000;
    const WALLET_INTERVAL = 30000;

    let DATA = null;
    let dataError = null;
    let livePrices = {};
    let livePricesAt = null;
    let livePricesError = null;
    let walletSol = null;
    let walletAt = null;
    let walletError = null;

    const $ = (html) => {
      const t = document.createElement("template");
      t.innerHTML = html.trim();
      return t.content;
    };
    const esc = (s) => String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
    const money = (n, d) => {
      if (n === null || n === undefined || !isFinite(n)) return "—";
      const x = Number(n);
      const abs = Math.abs(x).toFixed(d == null ? 2 : d);
      const [w, c] = abs.split(".");
      const w2 = w.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return w2 + "." + c;
    };
    const signed = (n) => {
      if (n === null || n === undefined || !isFinite(n)) return "—";
      const sign = n > 0 ? "+" : n < 0 ? "−" : "";
      return sign + "$" + money(Math.abs(n));
    };
    const px = (n) => {
      if (n === null || n === undefined || !isFinite(Number(n))) return "—";
      const x = Number(n);
      if (x === 0) return "0";
      const abs = Math.abs(x);
      let d = 2;
      if (abs < 1) d = 6;
      if (abs < 0.01) d = 8;
      if (abs < 0.0001) d = 10;
      let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s;
    };
    const clockNow = () => {
      try {
        return new Date().toLocaleTimeString("pl-PL", {
          timeZone: "Europe/Warsaw",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }) + " CET";
      } catch (e) {
        return new Date().toISOString();
      }
    };
    const fmtWhen = (isoOrLabel) => {
      if (!isoOrLabel) return "";
      const raw = String(isoOrLabel);
      try {
        const d = new Date(raw);
        if (!isNaN(d.getTime())) {
          return d.toLocaleTimeString("pl-PL", {
            timeZone: "Europe/Warsaw",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          });
        }
      } catch (e) {}
      return raw;
    };
    const shortMint = (m) => {
      const s = String(m || "");
      if (s.length <= 12) return s;
      return s.slice(0, 4) + "…" + s.slice(-4);
    };
    const isFile = () => location.protocol === "file:";

    function pickPair(payload, mint, pairAddress) {
      const list = Array.isArray(payload)
        ? payload
        : (payload && Array.isArray(payload.pairs) ? payload.pairs : []);
      const m = (mint || "").toLowerCase();
      const pa = (pairAddress || "").toLowerCase();
      const ofMint = list.filter((p) => {
        const base = ((p.baseToken && p.baseToken.address) || p.tokenAddress || "").toLowerCase();
        const quote = ((p.quoteToken && p.quoteToken.address) || "").toLowerCase();
        const chain = (p.chainId || "solana").toLowerCase();
        return chain === "solana" && (base === m || quote === m || !m);
      });
      const pool = ofMint.length ? ofMint : list;
      if (pa) {
        const exact = pool.find((p) => String(p.pairAddress || "").toLowerCase() === pa);
        if (exact && exact.priceUsd) return exact;
      }
      let best = null, bestLiq = -1;
      for (const p of pool) {
        const liq = Number((p.liquidity && (p.liquidity.usd || p.liquidity)) || 0);
        if (p.priceUsd && liq >= bestLiq) { best = p; bestLiq = liq; }
      }
      if (best) return best;
      return pool.find((p) => p.priceUsd) || null;
    }

    function liveState(data) {
      const slip = Number(data.slippage_and_fees != null ? data.slippage_and_fees : 0.01);
      const cash = Number(data.cash ?? 0);
      const realized = Number(data.realized_pnl ?? 0);
      const starting = Number(data.starting_budget ?? 100);
      let unreal = 0;
      let mtm = 0;
      let allLive = true;
      let anyLive = false;
      const opens = (data.open_positions || []).map((p) => {
        const live = livePrices[p.mint];
        const isLive = live && live.price != null && isFinite(live.price);
        const mark = isLive ? live.price : (p.mark_price != null ? Number(p.mark_price) : null);
        if (isLive) anyLive = true; else allLive = false;
        const qty = Number(p.qty ?? 0);
        const notional = Number(p.notional ?? p.entry_notional_usd ?? 0);
        let u = p.unrealized_pnl_usd;
        let liveMtm = null;
        if (mark != null && qty) {
          liveMtm = mark * (1 - slip) * qty;
          u = liveMtm - notional;
        }
        if (u != null && isFinite(Number(u))) unreal += Number(u);
        if (liveMtm != null) mtm += liveMtm;
        else if (notional) mtm += notional + Number(u || 0);
        const hard = p.stop_price != null ? Number(p.stop_price) : null;
        const trail = p.trailing_active && p.trailing_stop_price != null ? Number(p.trailing_stop_price) : null;
        const stop = trail != null ? trail : hard;
        let distPct = null;
        if (mark != null && stop != null && mark !== 0) {
          distPct = ((mark - stop) / mark) * 100;
        }
        return Object.assign({}, p, {
          live_mark: isLive ? mark : null,
          display_mark: mark,
          live: isLive,
          live_unrealized: u,
          dist_pct: distPct,
          effective_stop: stop,
          live_url: (live && live.url) || p.url || p.dex || ""
        });
      });
      const equity = cash + mtm;
      const pnl = equity - starting;
      const pnlPct = starting ? (pnl / starting) * 100 : 0;
      return { opens, equity, pnl, pnlPct, unreal, mtm, allLive, anyLive, cash, realized, starting };
    }

    function compsHtml(comps) {
      if (!comps || !comps.length) return `<div class="muted-empty">Brak składowych</div>`;
      return `<div class="comps">` + comps.map((c) => {
        const v = c.value;
        const w = (v == null) ? 0 : Math.max(0, Math.min(100, v));
        const txt = v == null ? "—" : Number(v).toFixed(1);
        return `<div class="comp"><span class="cl">${esc(c.label)}</span><span class="cv">${txt}</span>
          <div class="cbar"><i style="width:${w}%"></i></div></div>`;
      }).join("") + `</div>`;
    }

    function chartSvg(data, pnl) {
      const series = (data.equity_series || []).filter((p) => p.equity != null && isFinite(p.equity));
      const W = 390, H = 176, padT = 18, padB = 16;
      if (!series.length) {
        return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"></svg>`;
      }
      const vals = series.map((p) => p.equity);
      let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
      if (hi - lo < 1e-9) {
        const mid = lo;
        lo = mid - 0.62;
        hi = mid + 0.38;
      } else {
        const pad = (hi - lo) * 0.14;
        lo -= pad;
        hi += pad;
      }
      const span = hi - lo;
      const n = series.length;
      const xAt = (i) => n === 1 ? W / 2 : (i / (n - 1)) * W;
      const yAt = (v) => padT + (1 - (v - lo) / span) * (H - padT - padB);
      const pts = series.map((p, i) => [xAt(i), yAt(p.equity)]);
      const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" ");
      const lastY = pts[pts.length - 1][1];
      const area = line + ` L ${W} ${H} L 0 ${H} Z`;
      const up = pnl >= 0;
      const stroke = up ? "#22f08a" : "#ff3b5c";
      const fillId = up ? "eqUp" : "eqDn";
      const c1 = up ? "rgba(34,240,138,.28)" : "rgba(255,59,92,.28)";
      const c2 = up ? "rgba(34,240,138,0)" : "rgba(255,59,92,0)";
      const dots = pts.map((p) => `<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="2.2" fill="${stroke}"/>`).join("");
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${c1}"/>
            <stop offset="100%" stop-color="${c2}"/>
          </linearGradient>
        </defs>
        <path d="${area}" fill="url(#${fillId})"/>
        <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        <circle cx="${pts[pts.length-1][0].toFixed(2)}" cy="${lastY.toFixed(2)}" r="4" fill="${stroke}"/>
      </svg>`;
    }

    function render() {
      const app = document.getElementById("app");
      if (dataError && !DATA) {

      const [dollars, cents] = money(equity).split(".");
      const plClass = pnl > 0 ? "up" : pnl < 0 ? "down" : "flat";

      const topNow = (data.last_scored || [])[0];
      const analystComps = topNow ? compsHtml(topNow.components) : `<div class="muted-empty">Brak ocen w tym cyklu</div>`;
      const otherScores = (data.last_scored || []).map((t) => {

      }).join("");

      const intents = exec.intents || [];

      const lossUsed = live.anyLive
        ? Math.max(0, -(Math.min(0, live.realized) + Math.min(0, live.unreal)))

      /* show cycle loss_used from data; live drawdown is informational only if we have live marks */
      const shownLoss = risk.loss_used ?? 0;
      const lossPct = risk.loss_limit ? Math.max(0, Math.min(100, (shownLoss / risk.loss_limit) * 100)) : 0;
      const posPct = risk.max_positions ? Math.max(0, Math.min(100, ((risk.open_positions ?? live.opens.length) / risk.max_positions) * 100)) : 0;
      const lossBar = lossPct >= 80 ? "hot" : lossPct >= 50 ? "warn" : "";
      const posBar = posPct >= 80 ? "hot" : posPct >= 60 ? "warn" : "";

      const cards = [
        { en: "Scout", pl: "Zwiadowca", color: "var(--cyan)", wide: false, body: `
          <div class="sub">Ostatni cykl · sesja łącznie</div>
          <div class="stats">
            <div class="stat"><div class="n">${last.scouted ?? 0}</div><div class="l">przeskanowane</div></div>
            <div class="stat"><div class="n">${last.scout_passed ?? 0}</div><div class="l">przeszło dalej</div></div>
            <div class="stat"><div class="n">${sess.scouted ?? 0}</div><div class="l">sesja · skanowania</div></div>
            <div class="stat"><div class="n">${sess.scout_passed ?? 0}</div><div class="l">sesja · przekazania</div></div>
          </div>`},

        { en: "Analyst", pl: "Analityk", color: "var(--yellow)", wide: true, body: `

          ${topNow ? `<div class="tokrow" style="margin-top:0"><span class="ts">${esc(topNow.symbol)}</span><span class="sc">${topNow.score != null ? Number(topNow.score).toFixed(2) : "—"}</span></div>` : ""}
          ${analystComps}

        { en: "Executor", pl: "Wykonawca", color: "var(--green)", wide: false, body: `

        { en: "Risk", pl: "Ryzyko", color: "var(--red)", wide: false, body: `
          <div class="risk">
            <div class="r"><span class="k">Pozycje</span><span class="v">${risk.open_positions ?? live.opens.length} / ${risk.max_positions ?? 5}</span></div>
            <div class="bar ${posBar}"><i style="width:${posPct}%"></i></div>
            <div class="r"><span class="k">Wykorzystany limit straty</span><span class="v">$${money(shownLoss)} / $${money(risk.loss_limit)}</span></div>
            <div class="bar ${lossBar}"><i style="width:${lossPct}%"></i></div>
            <div class="rules">Stop −${risk.stop_pct ?? 12}% od wejścia. Trailing po +${risk.trail_activate_pct ?? 12}%, śledzi ${risk.trail_pct ?? 6}% pod szczytem.</div>
          </div>`},
        { en: "Logger", pl: "Rejestrator", color: "#c7c7cc", wide: false, body: `

            <div class="stat"><div class="n">${last.rejections ?? 0}</div><div class="l">w tym cyklu</div></div>

      ];

      const cardsHtml = cards.map((c, i) => `
        <article class="acard${c.wide ? " wide" : ""}" data-i="${i}">

      const dots = cards.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("");

      const funnelSteps = [
        { k: "Przeskanowane", v: last.scouted ?? 0, cls: "" },

      ];
      const fMax = Math.max(1, ...funnelSteps.map((s) => s.v));
      const funnelHtml = funnelSteps.map((s) => {

        return `<div class="frow"><div class="flab"><span class="fk">${esc(s.k)}</span><span class="fv">${s.v}</span></div>
          <div class="fbar ${s.cls}"><i style="width:${w}%"></i></div></div>`;
      }).join("");

      const rMax = Math.max(1, ...(data.reasons || []).map((r) => r.count));
      const reasonsHtml = (data.reasons || []).length
        ? data.reasons.map((r) => {

            const pct = sess.rejections ? ((r.count / sess.rejections) * 100).toFixed(1) : "0";
            return `<div class="reason"><div class="rl"><span class="rn">${esc(r.label)}</span><span class="rc">${r.count} · ${pct}%</span></div>

        : `<div class="muted-empty pad">Brak odrzuceń</div>`;

      const shownRej = (data.latest_rejections || []).slice(0, 30);
      const latestHtml = shownRej.length
        ? shownRej.map((r) => `
            <div class="row">

        ? data.top_session.map((t) => {
            const pass = t.score != null && t.score >= passScore;

            const mintLink = t.mint ? `<div class="mint"><a href="https://solscan.io/token/${esc(t.mint)}" target="_blank" rel="noopener">${esc(shortMint(t.mint))} · Solscan</a></div>` : "";

      const actHtml = (data.activity || []).length
        ? data.activity.map((a) => {
            const kind = a.kind || "cycle";

        : `<div class="muted-empty pad">Brak zdarzeń</div>`;

      const wallet = data.wallet || {};
      const addr = wallet.address || WALLET_DEFAULT;
      const walletVal = walletSol != null
        ? money(walletSol, 4) + " SOL"
        : (walletError ? "niedostępne" : "wczytywanie…");
      const walletWhen = walletAt ? " · " + walletAt : (walletError ? " · " + walletError : "");
      const banner = dataError
        ? `<div class="banner">${esc(dataError)}</div>`
        : (livePricesError && (data.open_positions || []).length
            ? `<div class="banner warn">Ceny na żywo z DexScreenera chwilowo niedostępne (${esc(livePricesError)}). Pokazuję kurs z ostatniego cyklu.</div>`
            : "");

      const liveHero = live.anyLive
        ? `<span class="live-tag"><i class="dot"></i>na żywo</span><span class="live-meta">${esc(livePricesAt || "")}</span>`
        : `<span class="live-tag off">z cyklu</span><span class="live-meta">equity z ostatniego cyklu</span>`;

      app.innerHTML = `
        <div class="top">
          <div class="brand">Stanowisko</div>
          <div class="paper"><i class="dot"></i>PAPER</div>
        </div>
        ${banner}
        <div class="hero">
          <div class="value">
            <span class="sigil">$</span><span>${dollars}</span><span class="cents">.${cents}</span>
          </div>
          <div class="pl-row">
            <div class="pl ${plClass}"><span>${plAmt}</span><span class="pct">${plPct}</span></div>
            ${liveHero}
          </div>
        </div>
        <div class="meta-line">${data.cycles_count || 0} cykli · ostatni <b>${esc(data.clock || "")}</b> ${esc((data.ts_warsaw || "").split(" ").slice(2).join(" "))} · gotówka $${money(data.cash)} · zreal. ${signed(data.realized_pnl)} · niezreal. ${signed(live.anyLive ? live.unreal : data.unrealized_pnl)}</div>
        <div class="wallet">
          <div class="wl">${esc(wallet.label || "portfel (prawdziwy)")}</div>
          <div class="wv">${esc(walletVal)}</div>
          <div class="wa"><a href="${esc(wallet.solscan || ("https://solscan.io/account/" + addr))}" target="_blank" rel="noopener">${esc(addr)}</a></div>
          <div class="live-meta" style="margin-top:4px">${esc((walletAt || walletError || "wczytywanie…") + " · tylko odczyt")}</div>
        </div>
        <div class="chart-wrap">${chartSvg(data, pnl)}</div>
        <div class="ranges">
          <span class="pill"><i class="dot"></i>SESJA PAPER</span>
          <span class="hint">wykres z cykli · kursy pozycji z DexScreenera</span>
        </div>

        <section class="sec">
          <div class="sec-h">
            <h2>Agenci</h2>
            <span class="right">6 etapów</span>
          </div>
          <div class="scroller" id="scroller">${cardsHtml}</div>
          <div class="dots" id="dots">${dots}</div>
        </section>

        <section class="sec">
          <div class="sec-h">
            <h2>Lejek</h2>
            <span class="right mute">ostatni cykl</span>
          </div>
          <div class="pad funnel">${funnelHtml}</div>
        </section>

        <section class="sec">
          <div class="sec-h">
            <h2>Odrzucenia</h2>
            <span class="right mute">${sess.rejections ?? 0} łącznie</span>
          </div>
          <div class="pad">${reasonsHtml}</div>
        </section>

        <section class="sec">
          <div class="sec-h">
            <h2>Ostatnie odrzucenia</h2>
            <span class="right mute">${shownRej.length} z ${(data.latest_rejections || []).length}</span>
          </div>
          <div class="list">${latestHtml}</div>
        </section>

        <section class="sec">
          <div class="sec-h">
            <h2>Najwyższe oceny</h2>
            <span class="right mute">sesja · DexScreener</span>
          </div>
          ${topHtml}
        </section>

        <section class="sec">
          <div class="sec-h">
            <h2>Pozycje paper</h2>
            <span class="right mute">${risk.open_positions ?? live.opens.length} / ${risk.max_positions ?? 5} otwartych</span>
          </div>
          ${openHtml}
          <div class="sec-h" style="padding-top:18px">
            <h2>Zamknięte</h2>
            <span class="right mute">${(data.closed_trades || []).length}</span>
          </div>
          ${closedHtml}
        </section>

        <section class="sec">
          <div class="sec-h">
            <h2>Aktywność</h2>
            <span class="right mute">PAPER</span>
          </div>
          <div class="act">${actHtml}</div>
        </section>
      `;

      const scroller = document.getElementById("scroller");
      const dotsWrap = document.getElementById("dots");
      if (scroller && dotsWrap) {
        const update = () => {
          const cardsEl = [...scroller.querySelectorAll(".acard")];
          const left = scroller.scrollLeft;
          let idx = 0, best = Infinity;
          cardsEl.forEach((el, i) => {
            const d = Math.abs(el.offsetLeft - left - 22);
            if (d < best) { best = d; idx = i; }
          });
          dotsWrap.querySelectorAll("i").forEach((d, i) => d.classList.toggle("on", i === idx));
        };
        scroller.addEventListener("scroll", update, { passive: true });
      }
    }

    async function fetchData() {
      try {
        const r = await fetch("./data.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const json = await r.json();
        DATA = json;
        dataError = null;
        render();
        return true;
      } catch (e) {
        const hint = isFile()
          ? "Nie wczytano data.json. Przy otwarciu jako plik lokalny przeglądarka często blokuje ten odczyt. Uruchom stronę przez serwer HTTP albo GitHub Pages."
          : "Nie wczytano data.json (" + (e && e.message ? e.message : "błąd sieci") + "). Sprawdź, czy plik leży obok index.html.";
        dataError = hint;
        render();
        return false;
      }
    }

    async function fetchPrices() {
      if (!DATA) return;
      const opens = DATA.open_positions || [];
      const mints = [...new Set(opens.map((p) => p.mint).filter(Boolean))];
      if (!mints.length) {
        livePrices = {};
        livePricesError = null;
        livePricesAt = null;
        render();
        return;
      }
      const byMint = {};
      const ingest = (payload) => {
        for (const p of opens) {
          const pair = pickPair(payload, p.mint, p.pair_address);
          const price = pair ? Number(pair.priceUsd) : NaN;
          if (isFinite(price) && price > 0) {
            byMint[p.mint] = {
              price,
              url: pair.url || p.url || p.dex || "",
              pair: pair.pairAddress || p.pair_address || ""
            };
          }
        }
      };
      try {
        let ok = false;
        try {
          const r = await fetch(DEX_V1 + mints.join(","), { cache: "no-store" });
          if (r.ok) {
            ingest(await r.json());
            ok = Object.keys(byMint).length > 0;
          }
        } catch (e) {}
        if (!ok) {
          const r2 = await fetch(DEX_LEGACY + mints.join(","), { cache: "no-store" });
          if (!r2.ok) throw new Error("HTTP " + r2.status);
          ingest(await r2.json());
        }
        if (!Object.keys(byMint).length) throw new Error("brak ceny");
        livePrices = byMint;
        livePricesAt = clockNow();
        livePricesError = null;
        render();
      } catch (e) {
        livePricesError = (e && e.message) ? e.message : "błąd";
        render();
      }
    }

    async function fetchWallet() {
      const wallet = (DATA && DATA.wallet) || {};
      const addr = wallet.address || WALLET_DEFAULT;
      const rpc = wallet.rpc || RPC_DEFAULT;
      try {
        const r = await fetch(rpc, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: 1,
            method: "getBalance",
            params: [addr]
          })
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        if (j.error) throw new Error(j.error.message || "RPC error");
        const lamports = j.result && j.result.value;
        if (lamports == null) throw new Error("brak wyniku");
        walletSol = Number(lamports) / 1e9;
        walletAt = clockNow();
        walletError = null;
        render();
      } catch (e) {
        walletError = "RPC: " + ((e && e.message) ? e.message : "błąd");
        render();
      }
    }

    fetchData().then((ok) => {
      fetchWallet();
      if (ok) fetchPrices();
    });
    setInterval(fetchData, DATA_INTERVAL);
    setInterval(fetchPrices, PRICE_INTERVAL);
    setInterval(fetchWallet, WALLET_INTERVAL);
  })();
  </script>
</body>
</html>
